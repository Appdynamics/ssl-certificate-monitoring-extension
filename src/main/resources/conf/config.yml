### ANY CHANGES TO THIS FILE DOES NOT REQUIRE A RESTART ###

#This will create this metric in all the tiers, under this path
#metricPrefix:  "Custom Metrics|SslCertificate"

#This will create it in specific Tier. Replace <TIER_ID>
metricPrefix: Server|Component:<TIER NAME OR TIER ID>|Custom Metrics|SslCertificate

domains:
  - domain: "www.google.com"
    port: 443
    displayName: "Google"

  - domain: "www.ebay.com"
    port: 443
    displayName: "eBay"

  - domain: "www.amazon.com"
    port: 443
    displayName: "amazon"

  # Example: monitor a backend certificate behind a load balancer.
  # targetHost (optional) — IP or hostname to connect to; domain is used as SNI.
  # Without targetHost the extension connects to domain directly.
  #- domain: "example.com"
  #  port: 443
  #  displayName: "Example Backend"
  #  targetHost: "10.0.0.5"

# Point to .sh for unix based and .bat for windows.
# Incase if you are using Cygwin's openssl, please make sure to change the openssl.bat to point to Cygwin's openssl.
# For eg. echo | C:\Cygwin64\bin\openssl s_client -connect %1:%2 2> null | C:\Cygwin64\bin\openssl x509 -noout -enddate
# The script receives: <connectTo> <port> [sniHostname] (the 3rd argument is omitted when domain is an IP address).
# Pass -servername %3 only when %3 is set; when it is not set, pass -noservername (OpenSSL 1.1.1+), otherwise OpenSSL
# derives SNI from the -connect hostname (see cmd/openssl.bat).
cmdFile: "monitors/SslCertificateMonitor/cmd/openssl.sh"
#cmdFile: "monitors\\SslCertificateMonitor\\cmd\\openssl.bat"


#### Configurations below this need not be changed.###
# number of concurrent tasks
numberOfThreads: 10

#timeout for the thread
threadTimeout: 5
